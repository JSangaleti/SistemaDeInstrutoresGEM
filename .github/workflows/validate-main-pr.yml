name: Validar PR para main

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  validate-source-branch:
    name: Permitir apenas PR da develop para main
    runs-on: ubuntu-latest

    steps:
      - name: Verificar branch de origem
        run: |
          echo "Branch de origem: ${{ github.head_ref }}"
          echo "Branch de destino: ${{ github.base_ref }}"

          if [ "${{ github.base_ref }}" = "main" ] && [ "${{ github.head_ref }}" != "develop" ]; then
            echo "Erro: PRs para a main só podem vir da branch develop."
            exit 1
          fi

          echo "PR válida."
